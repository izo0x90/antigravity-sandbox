# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Prime Agent
description: Prime Intellect's self-improving RLM coding agent and tool harness.
version: "1.0.0"
provides: ["prime-agent"]

capabilities:
  # prime-agent talks to whichever model provider the user configures; no fixed host list.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow: ["*"]

  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: mkdir -p "$HOME/.prime"
          user: "1000"
          description: Initialize the Prime Agent working directory

  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        Prime Agent (`prime-agent`) is installed at /usr/local/bin/prime-agent. State lives in ~/.prime.
