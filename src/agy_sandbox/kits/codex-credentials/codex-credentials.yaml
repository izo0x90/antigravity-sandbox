# syntax=docker/sandbox-kit:3
# The proxy-managed half of kits/codex, vendored from Docker's codex mixin.
# Declaration-only: an OpenAI API key or ChatGPT OAuth session (sbx secret set
# openai) stays on the host and the sandbox proxy injects it. The codex kit's
# install hook writes auth.json and config.toml from the surfaced mode.
schemaVersion: "3"
kind: mixin
displayName: Codex (proxy-managed credentials)
description: OpenAI API key or ChatGPT OAuth held on the host and injected by the sandbox proxy. Attached when auth_mode is proxy-managed.
version: "1.0.0"
requires: ["codex"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.openai.com
          - openai.com
          - auth.openai.com
          - chatgpt.com

  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenAI API access (API key or ChatGPT OAuth)
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.openai.com, header: Authorization, format: "Bearer %s"}
          - {domain: openai.com, header: Authorization, format: "Bearer %s"}
      oauth:
        tokenEndpoint: {host: auth.openai.com, path: /oauth/token}
        resourceHosts: [chatgpt.com]
        sentinels:
          accessToken: oai-oat01-proxy-managed
          refreshToken: oai-ort01-proxy-managed
