# syntax=docker/sandbox-kit:3
# The proxy-managed half of kits/claude, vendored from Docker's claude mixin.
# Declaration-only: an Anthropic API key or a claude.ai subscription OAuth session
# (sbx secret set anthropic) stays on the host and the sandbox proxy injects it.
# agy-sandbox attaches this kit next to claude only when auth_mode is proxy-managed.
schemaVersion: "3"
kind: mixin
displayName: Claude Code (proxy-managed credentials)
description: Anthropic API key or claude.ai OAuth held on the host and injected by the sandbox proxy. Attached when auth_mode is proxy-managed.
version: "1.0.0"
requires: ["claude"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.anthropic.com
          - claude.ai
          - console.anthropic.com
          - mcp-proxy.anthropic.com
          - platform.claude.com

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Anthropic API access (API key or claude.ai OAuth)
    config:
      service: anthropic
      phase: runtime
      apiKey:
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: "%s"}
          - {domain: mcp-proxy.anthropic.com, header: x-api-key, format: "%s"}
      oauth:
        tokenEndpoint: {host: platform.claude.com, path: /v1/oauth/token}
        resourceHosts: [api.anthropic.com, claude.ai, console.anthropic.com, mcp-proxy.anthropic.com]
        sentinels:
          accessToken: sk-ant-oat01-proxy-managed
          refreshToken: sk-ant-ort01-proxy-managed
        credentialFile:
          path: ~/.claude/.credentials.json
          structure:
            claudeAiOauth:
              accessToken: "{{.AccessToken}}"
              refreshToken: "{{.RefreshToken}}"
              expiresAt: "{{.ExpiresAt}}"
              scopes: "{{.Scopes}}"
            primaryApiKey: "{{.PrimaryApiKey}}"
