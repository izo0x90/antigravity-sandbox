# syntax=docker/sandbox-kit:3
# Claude Code for agy-sandbox. The binary overlay is Docker's published claude
# mixin (see claude.dockerfile); this descriptor replaces Docker's so that no
# credential is declared here. `claude /login` inside the sandbox holds the real
# credential by default; the claude-credentials kit is attached for proxy-managed
# logins, and the settings hook then sees SBX_CRED_ANTHROPIC_MODE != none.
schemaVersion: "3"
kind: mixin
displayName: Claude Code
description: Anthropic's Claude Code with sandbox-local sign-in by default. Proxy-managed credentials come from the claude-credentials kit.
version: "1.0.0"
provides: ["claude"]

args:
  IS_SANDBOX:
    default: "1"
    env: IS_SANDBOX
  DISABLE_TELEMETRY:
    default: "1"
    description: Opt out of usage reporting (fail-closed; override per sandbox to re-enable)
    env: DISABLE_TELEMETRY
  DISABLE_ERROR_REPORTING:
    default: "1"
    env: DISABLE_ERROR_REPORTING
  CLAUDE_ENV_FILE:
    default: /etc/sandbox-persistent.sh
    description: Sourced before every Bash tool call, so exports appended there persist
    env: CLAUDE_ENV_FILE

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.anthropic.com
          - console.anthropic.com
          - claude.ai
          - mcp-proxy.anthropic.com
          - platform.claude.com          # OAuth token endpoint for subscription logins
          - downloads.claude.ai          # `claude update` / `claude install`
          - claude.com                   # account and sign-in pages
          - code.claude.com              # documentation the CLI links to
          - bridge.claudeusercontent.com # /remote-control relay

  # Session state survives recreation; subdirectories rather than ~/.claude so that
  # kit-managed files (settings.json, .credentials.json) keep coming from the hooks.
  - type: com.docker.sandbox/volume@1
    config: {path: /home/agent/.claude/projects, size: 2g}
  - type: com.docker.sandbox/volume@1
    config: {path: /home/agent/.claude/sessions, size: 512m}
  - type: com.docker.sandbox/volume@1
    config: {path: /home/agent/.claude/todos, size: 512m}
  - type: com.docker.sandbox/volume@1
    config: {path: /home/agent/.claude/shell-snapshots, size: 512m}
  - type: com.docker.sandbox/volume@1
    config: {path: /home/agent/.claude/statsig, size: 512m}

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -e
            ws="${WORKSPACE_DIR:-/}"
            esc=$(printf '%s' "$ws" | sed 's/\\/\\\\/g; s/"/\\"/g')
            projects="\"/\": { \"hasTrustDialogAccepted\": true }"
            [ "$ws" = "/" ] || projects="$projects, \"$esc\": { \"hasTrustDialogAccepted\": true }"
            printf '%s\n' "{ \"bypassPermissionsModeAccepted\": true, \"hasCompletedOnboarding\": true, \"hasSeenAutoDefaultNudge\": true, \"projects\": { $projects } }" > /home/agent/.claude.json
            chown agent:agent /home/agent/.claude.json
          user: "0"
          env: [WORKSPACE_DIR]
          description: Seed Claude bypass and trust flags
        - command: mkdir -p /home/agent/.claude && chown agent:agent /home/agent/.claude
          user: "0"
          description: Ensure ~/.claude is agent-owned before the settings seed
        # settings.json is kit-managed and rewritten on every (re)create. The proxy
        # helper is written only when a credential is attached; without it Claude
        # Code prompts for /login.
        - command: |
            set -e
            HELPER=''
            [ "${SBX_CRED_ANTHROPIC_MODE:-none}" = none ] || HELPER='"apiKeyHelper": "echo proxy-managed",'
            printf '%s\n' "{ \"themeId\": 1, \"alwaysThinkingEnabled\": true, $HELPER \"permissions\": { \"defaultMode\": \"bypassPermissions\" }, \"bypassPermissionsModeAccepted\": true, \"skipDangerousModePermissionPrompt\": true }" > /home/agent/.claude/settings.json
          user: agent
          env: [SBX_CRED_ANTHROPIC_MODE]
          description: Seed settings.json; the proxy helper only when a credential is attached
        - command: |
            set -e
            [ -n "$MCP_GATEWAY_URL" ] || exit 0
            claude mcp add mcp-gateway "$MCP_GATEWAY_URL" --transport http --scope user --header "Authorization: Bearer $MCP_SENTINEL_TOKEN_NAME" || true
          user: agent
          env: [MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Register the sandbox MCP gateway
      startup:
        # Block volumes mount with a root-owned root; re-own them before the agent runs.
        - command: [sh, -c, "chown -R agent:agent /home/agent/.claude/projects /home/agent/.claude/sessions /home/agent/.claude/todos /home/agent/.claude/shell-snapshots /home/agent/.claude/statsig 2>/dev/null || true"]
          user: "0"
          description: Re-own session-state volumes to the agent user
        - command: |
            set -e
            [ -n "$MCP_GATEWAY_URL" ] || exit 0
            claude mcp add mcp-gateway "$MCP_GATEWAY_URL" --transport http --scope user --header "Authorization: Bearer $MCP_SENTINEL_TOKEN_NAME" || true
          user: agent
          env: [MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Register the sandbox MCP gateway (startup fallback)

  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        ## Claude Code: environment persistence

        `CLAUDE_ENV_FILE` is `/etc/sandbox-persistent.sh` and is sourced before every Bash tool
        call. Append `export NAME=value` lines there to persist variables across commands.
        Never add shell completion scripts to it: they rely on variables that only exist during
        tab completion and will make every Bash command return nothing.
