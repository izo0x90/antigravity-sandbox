schemaVersion: "1"
kind: mixin
name: chrome-devtools
displayName: Chrome DevTools MCP Kit
description: Headless Chrome + chrome-devtools-mcp MCP server for browser automation/debugging

caps:
  network:
    allow:
      - "registry.npmjs.org:443"
      - "registry.yarnpkg.com:443"
      - "nodejs.org:443"
      - "*:443"
      - "*:80"
      - "*:22"
      - "*:53"

commands:
  startup:
    - command:
        - "bash"
        - "-c"
        - |
          # Host-browser mode: kits/chrome-host relays a Chrome on the host to 127.0.0.1:9222,
          # so the in-sandbox Chromium (steps 1-2) is skipped. Steps 3-5 are identical in both modes.
          HOST_BROWSER_MODE="${CHROME_DEVTOOLS_HOST_BROWSER:-0}"

          # 1. Install container-native snap-free Chromium on first startup (idempotent)
          if [ "$HOST_BROWSER_MODE" = "1" ]; then
            echo "-> Host browser mode: using the host Chrome relayed to 127.0.0.1:9222."
          elif ! command -v chromium &>/dev/null && ! command -v chromium-browser &>/dev/null; then
            echo "-> Installing native Chromium (snap-free)..."
            # Wait for the apt/dpkg locks: other kits (shell/claude/opencode/codex) run a background
            # `apt-get update` at startup, and a lock clash would make this install fail.
            # DPkg::Lock::Timeout covers installs; `update` (lists lock) needs the retry loop.
            APT_GET="sudo apt-get -o DPkg::Lock::Timeout=300"
            apt_update() { for _ in $(seq 1 150); do $APT_GET update && return 0; sleep 2; done; return 1; }
            apt_update
            $APT_GET install -y curl gnupg
            sudo rm -f /usr/share/keyrings/debian-archive-keyring.gpg /usr/share/keyrings/debian-security-archive-keyring.gpg
            sudo curl -fsSL https://ftp-master.debian.org/keys/archive-key-12.asc | sudo gpg --dearmor -o /usr/share/keyrings/debian-archive-keyring.gpg
            sudo curl -fsSL https://ftp-master.debian.org/keys/archive-key-12-security.asc | sudo gpg --dearmor -o /usr/share/keyrings/debian-security-archive-keyring.gpg
            sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/debian-bookworm.list'
            sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/debian-security-archive-keyring.gpg] http://security.debian.org/debian-security bookworm-security main" >> /etc/apt/sources.list.d/debian-bookworm.list'
            sudo sh -c 'printf "Package: chromium* chromium-driver*\nPin: release n=bookworm\nPin-Priority: 700\n\nPackage: chromium* chromium-driver*\nPin: release n=bookworm-security\nPin-Priority: 700\n" > /etc/apt/preferences.d/chromium.pref'
            apt_update
            $APT_GET install -y chromium fonts-liberation
          else
            echo "-> Chromium is already installed."
          fi

          # 2. Start container-native headless Chromium (port 9222 belongs to the relay in host-browser mode)
          if [ "$HOST_BROWSER_MODE" != "1" ] && command -v chromium &>/dev/null; then
            CHROMIUM_BIN=chromium
          elif [ "$HOST_BROWSER_MODE" != "1" ] && command -v chromium-browser &>/dev/null; then
            CHROMIUM_BIN=chromium-browser
          fi

          if [ ! -z "$CHROMIUM_BIN" ]; then
            echo "-> Starting headless Chromium on port 9222..."
            rm -f /tmp/chrome-profile-stable/SingletonLock
            $CHROMIUM_BIN \
              --headless \
              --remote-debugging-port=9222 \
              --remote-debugging-address=127.0.0.1 \
              --disable-gpu \
              --no-sandbox \
              --disable-dev-shm-usage \
              --user-data-dir=/tmp/chrome-profile-stable > /tmp/chromium-headless.log 2>&1 &
          fi

          # Steps 3-5 need Node.js/npm from the project image (build_args.NODE_VERSION).
          # Without it, skip them instead of failing kit startup (which aborts the sandbox).
          if ! command -v npm &>/dev/null || ! command -v node &>/dev/null; then
            echo "⚠️  Node.js/npm not found in image; skipping chrome-devtools-mcp install and MCP registration."
            exit 0
          fi

          # 3. Install newest version of chrome-devtools-mcp globally (idempotent)
          if ! npm list -g chrome-devtools-mcp &>/dev/null; then
            echo "-> Installing newest version of chrome-devtools-mcp globally..."
            sudo npm install -g chrome-devtools-mcp@latest
          else
            echo "-> chrome-devtools-mcp is already installed globally."
          fi

          # 4. Non-destructively merge chrome-devtools config into agent configs (Antigravity & OMP)
          echo "-> Safely merging chrome-devtools config into agent configs..."
          node -e '
            const fs = require("fs");
            const path = require("path");

            // 1. Antigravity MCP configuration
            const agyPath = "/home/agent/.gemini/config/mcp_config.json";
            let agyConfig = { mcpServers: {} };
            try {
              if (fs.existsSync(agyPath)) {
                const content = fs.readFileSync(agyPath, "utf8").trim();
                if (content) agyConfig = JSON.parse(content);
              }
            } catch (e) {}
            if (!agyConfig.mcpServers) agyConfig.mcpServers = {};
            agyConfig.mcpServers["chrome-devtools"] = {
              command: "chrome-devtools-mcp",
              args: ["--browser-url=http://127.0.0.1:9222", "--no-usage-statistics"]
            };
            fs.mkdirSync(path.dirname(agyPath), { recursive: true });
            fs.writeFileSync(agyPath, JSON.stringify(agyConfig, null, 2), "utf8");

            // 2. OMP native browser CDP configuration
            const ompPath = "/home/agent/.omp/config.json";
            let ompConfig = {};
            try {
              if (fs.existsSync(ompPath)) {
                const content = fs.readFileSync(ompPath, "utf8").trim();
                if (content) ompConfig = JSON.parse(content);
              }
            } catch (e) {}
            if (!ompConfig.browser) ompConfig.browser = {};
            ompConfig.browser.cdpUrl = "http://127.0.0.1:9222";
            ompConfig.browser.executablePath = "/usr/bin/chromium";
            ompConfig.browser.args = ["--no-sandbox", "--disable-dev-shm-usage"];
            fs.mkdirSync(path.dirname(ompPath), { recursive: true });
            fs.writeFileSync(ompPath, JSON.stringify(ompConfig, null, 2), "utf8");
          '

          # 5. Register chrome-devtools MCP server with Claude Code, if installed (remove-then-add is idempotent)
          export PATH="$HOME/.local/bin:$HOME/.claude/local:$PATH"
          if command -v claude &>/dev/null; then
            echo "-> Registering chrome-devtools MCP server with Claude Code..."
            claude mcp remove --scope user chrome-devtools >/dev/null 2>&1 || true
            claude mcp add --scope user chrome-devtools -- chrome-devtools-mcp --browser-url=http://127.0.0.1:9222 --no-usage-statistics || true
          fi
      user: "1000"
      description: "Pre-spawn Chromium, configure chrome-devtools MCP server"
