# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Mojo Standard Library Developer Kit
description: Bazelisk and the LLVM lit test runner for modularml/mojo standard library development.
version: "1.0.0"
provides: ["mojo-stdlib"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          - pypi.org
          - files.pythonhosted.org
          - "*"

  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: |
            set -e
            if ! command -v bazel >/dev/null 2>&1; then
              ARCH=$(dpkg --print-architecture)
              echo "-> Installing Bazelisk for ${ARCH}..."
              sudo curl -fsSL "https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-${ARCH}" -o /usr/local/bin/bazel
              sudo chmod +x /usr/local/bin/bazel
            fi
            if ! command -v lit >/dev/null 2>&1; then
              echo "-> Installing the LLVM lit test runner..."
              sudo uv pip install --system lit || sudo pip install lit
            fi
          user: "1000"
          description: Install Bazelisk and LLVM lit
