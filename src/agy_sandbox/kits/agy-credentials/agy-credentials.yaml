# syntax=docker/sandbox-kit:3
# The proxy-managed half of kits/agy. Declaration-only: the real Google OAuth
# session (sbx secret set antigravity) and an optional Gemini API key (sbx secret
# set google) stay on the host, the sandbox sees sentinels, and the sandbox proxy
# swaps the real values in on the listed hosts. agy-sandbox attaches this kit next
# to agy only when auth_mode is proxy-managed.
#
# For GCP / Gemini Enterprise logins the token store holds tokens, not the project
# you picked, so pass them as kit args in agy.yaml:
#   kit_args:
#     agy-credentials.auth_method: gcp
#     agy-credentials.gcp_project: my-project
schemaVersion: "3"
kind: mixin
displayName: Google Antigravity (proxy-managed credentials)
description: Holds Antigravity's Google OAuth session and an optional Gemini API key on the host; the sandbox proxy injects them. Attached when auth_mode is proxy-managed.
version: "1.0.0"
requires: ["antigravity"]

args:
  auth_method:
    default: consumer
    enum: [consumer, gcp]
    description: Login method written into the token file; gcp for Google Cloud / Gemini Enterprise
  gcp_project:
    default: ""
    description: Google Cloud project ID (gcp only)
  gcp_location:
    default: global
    description: Google Cloud location (gcp only)

capabilities:
  # Every host a credential below injects into or presents a bearer to.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - oauth2.googleapis.com
          - www.googleapis.com
          - play.googleapis.com
          - generativelanguage.googleapis.com
          - aicode.googleapis.com
          - cloudaicompanion.googleapis.com
          - cloudcode-pa.googleapis.com
          - daily-cloudcode-pa.googleapis.com
          - businessaicode.googleapis.com
          - aiplatform.googleapis.com

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Gemini API key for Antigravity's headless API-key mode (sbx secret set google)
    config:
      service: google
      phase: runtime
      apiKey:
        name: GEMINI_API_KEY
        proxyManaged: true
        inject:
          - {domain: generativelanguage.googleapis.com, header: x-goog-api-key, format: "%s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Google OAuth session used by Antigravity (sbx secret set antigravity)
    config:
      service: antigravity
      phase: runtime
      oauth:
        tokenEndpoint: {host: oauth2.googleapis.com, path: /token}
        resourceHosts:
          - businessaicode.googleapis.com
          - aiplatform.googleapis.com
          - play.googleapis.com
          - aicode.googleapis.com
          - cloudaicompanion.googleapis.com
          - cloudcode-pa.googleapis.com
          - daily-cloudcode-pa.googleapis.com
          - generativelanguage.googleapis.com
          - www.googleapis.com
        sentinels:
          accessToken: agy-oauth-access-proxy-managed
          refreshToken: agy-oauth-refresh-proxy-managed
        credentialFile:
          path: ~/.gemini/antigravity-cli/antigravity-oauth-token
          # The host proxy refreshes the real token; the far-future expiry keeps the
          # sentinel locally "valid" so agy never tries to refresh it itself.
          structure:
            token:
              access_token: "{{.AccessToken}}"
              token_type: Bearer
              refresh_token: "{{.RefreshToken}}"
              expiry: "9999-12-31T23:59:59Z"
            auth_method: "${{ kit.args.auth_method }}"
            project_id: "${{ kit.args.gcp_project }}"
            region: "${{ kit.args.gcp_location }}"
