profile: default
project_name: test_project
build_args:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
setup_scripts:
- npm install
- pip install -r requirements.txt
env:
- ENVIRONMENT=development
use_native_login: false
sbx:
  enabled: true
  agent: agy
  clone: true
  kits:
  - git+https://github.com/shelajev/agy-sbx-kit.git
  - .
